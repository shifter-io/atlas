# Work areas of proxy-index for orchd: one open task per area (GLOBAL 3.1). The repository keeps no
# area table, so this map is derived from the tree: one area per group of subpackages of
# src/proxy_index that change together, each with its tests (tests/ is flat, so by file prefix and,
# for the rest, by the package a test mainly imports), its test fixtures, scripts, configs and
# documentation page. The package root (__init__.py) and its entry points (cli.py, models.py,
# errors.py), the project manifest and lockfile, CI with its gate scripts (scripts/ci/) and
# scripts/postgres_local.py, which starts the CI jobs' database, the shared test helpers, the
# README and the developer guide are `shared`. The globs are pairwise disjoint and cover every
# tracked file. A path that matches no glob (a new provider config, a new top-level test) counts as
# area:shared, which conflicts with every area.
# Generators checked: formula/ writes formulas/<network>.json and formulas/SUMMARY.md (same area);
# no CI step compares a committed output with its generator.
v = 1

[areas]
# the browser pulse: the browser package, its host (launchd and systemd examples), capture script,
# settings example, tests, fixtures and docs/browser.html
browser = [
    "src/proxy_index/browser/**",
    "tests/test_browser_*.py",
    "tests/browser_site.py",
    "tests/browser_targets_cases.py",
    "tests/fixtures/browser/**",
    "docs/browser.html",
    "scripts/browser_capture.py",
    "configs/browser-pulse.example.toml",
    "configs/launchd/**",
    "configs/systemd/**",
]
# the calculated website data: the calculated package, its schema and migrations, the methodology
