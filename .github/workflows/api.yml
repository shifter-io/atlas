# The API's Tier 1 (api/), on every ready pull request, every merge-queue test,
# nightly and on owner dispatches: gofmt, go vet and the Go tests, database tests
# included. main only ever gets what the queue tested, so pushes to main run nothing.
# `api` is a required check of the merge queue (CI-GATE-1), so it reports on every
# pull request and queue test: a first job, `api-changes`, on GitHub's runner (seconds,
# no CI server), compares the head with the base (a pull request's base branch, a queue
# test's base commit) and decides whether the change touches api/, the framework's SQL
# (src/proxy_index/**/*.sql, the schema the database tests load) or this file. When it
# does not, `api` ends green in seconds on GitHub's runner, without the server or the
# database; when it does, `api` runs the build and tests below. If `api-changes` fails,
# `api` fails. The commit-message, identity, secret and privacy checks run for every
# change in ci.yml's tier1.
#
# The build and tests run on one fresh one-job CI-SelfHosted server per run, labelled
# ci-32cpu, with all their work in parallel there (CI-SPEED-2): gofmt, go vet and the Go
# vulnerability scan (govulncheck at a pinned version, SEC-GO-1: a vulnerability the code
# reaches fails the run) in the background, while the Go tests run every package at once (-p = the CPU count) against a throwaway
# PostgreSQL 17 (the framework CI's pinned build, kept in the server cache) loaded with the
# framework schema from the same checkout (src/proxy_index). The slowest tests run in
# their own process beside them, so the rest of their package does not wait for them: one
# of them is the siteapi's peak memory on a production week (TestPeakRSS, SITEAPI-MEM-1,
# at most 3 GB; its peaks in the job summary), on a PostgreSQL cluster of its own. When
# all of that has finished, the cached-answer latency test (TestServeFromDatabase, p99
# within 2 ms) runs alone, so no other test shares the CPUs while it measures, then the
# page latency test (TestPageLatency, PAGE-LATENCY-1: every request of every Proxy Index
# page against a production week, within bench.CIGuard, 5 times the staging budgets; a
# request or page over it is measured once more; its time, STAGING-BUDGET warnings and
# largest p99 ratios in the job summary). Every go test run writes go test -json; then
# scripts/ci/timing.py writes the 20 slowest tests and subtests and the test steps' time to the job summary and the api-timing artifact
# (90 days), and fails the job when a test takes 90 s or more or the steps over 240 s
# (CI-TIME-1). Nightly and on dispatches only, after the tests (passed or not), go test
# -race without the database runs in its own step (RACE-1; it reports its time, without
# the per-test limit, as it gates no merge), then the Go module check (GO-AUDIT-1): a
# go mod tidy that must leave go.mod and go.sum unchanged. Go, the Go build cache and the module cache live under
# $CI_CACHE_DIR/<repository name>/, beside tier1's tools (both fill the same
# PostgreSQL folder, each by an atomic rename); the checkout is cleaned each run. A job-started hook on the servers refuses
# every job except the owner's pull requests from this repository's own branches,
# merge-queue tests, schedules on main and owner dispatches. Draft pull requests run
# nothing until they are marked ready; a change whose only API files are Markdown
# outside api/fixtures/ and no framework SQL skips the build and tests.
name: api

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    # The race run and the Go dependency audit (not merge gates).
    - cron: '30 1 * * *'
  workflow_dispatch:

# Its own group: ci.yml's `ci-` group would cancel tier1 in the same repository.
# One group per queue entry (its merge commit), never cancelled.
concurrency:
  group: api-${{ github.event_name == 'merge_group' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: 1.27.4
  GO_SHA256: 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840
  # The framework CI's PostgreSQL (theseus-rs/postgresql-binaries).
  PG_VERSION: 17.11.1
  PG_SHA256: aa8e2e97574bd789119ac01f1dddcd7a038c84e5c308d7b753018618258f0fbd
  # The slowest tests, in their own process beside the others.
  SLOW_TEST: ^TestEveryV4Answer$
  # The siteapi's peak memory on a production week (SITEAPI-MEM-1), in its own process too:
  # its builds run in a child process whose RSS it measures.
  PEAK_RSS_TEST: ^TestPeakRSS$
  # The latency test, run alone after every other test (API-SUM-FIX-1).
  LATENCY_TEST: ^TestServeFromDatabase$
  # Every page's requests on a production week, alone after that (PAGE-LATENCY-1), and the
  # first q= search of a 150,000-row list after a build (COVERAGE-SEARCH-1).
  PAGE_LATENCY_TEST: ^(TestPageLatency|TestFirstCoverageSearchAfterABuild)$

jobs:
  api-changes:
    name: api-changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Changed files
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          # A dispatch or schedule has no "before": compare with the parent.
          case "$BASE" in ''|0000000000000000000000000000000000000000) BASE=HEAD~1 ;; esac
          files=$(git diff --name-only --no-renames "$BASE...HEAD")
          code=false
          while IFS= read -r f; do
            case "$f" in
              api/fixtures/*|.github/workflows/api.yml) code=true ;;
              api/*.md) ;;
              api/*) code=true ;;
              # The schema the database tests load.
              src/proxy_index/*.sql) code=true ;;
              # Other framework files are tier1's (ci.yml).
              *) ;;
            esac
          done <<< "$files"
          [ -n "$files" ] || code=true
          # The nightly run and a dispatch test whatever the last commit changed.
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) code=true ;; esac
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  api:
    name: api
    needs: api-changes
    # Also when api-changes failed, so `api` fails instead of being skipped (a skipped
    # required check counts as passed).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # GitHub's runner when the API is untouched: green in seconds, no CI server.
    runs-on: ${{ fromJSON(needs.api-changes.outputs.code == 'true' && '["self-hosted", "ci-32cpu"]' || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: api
    steps:
      - name: Changed files decided
        working-directory: .
        env:
          RESULT: ${{ needs.api-changes.result }}
        run: '[ "$RESULT" = success ] || { echo "api-changes ended $RESULT"; exit 1; }'
      - name: API untouched
        if: needs.api-changes.outputs.code != 'true'
        working-directory: .
        run: echo "no change to api/, the framework SQL or api.yml; nothing to test"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.api-changes.outputs.code == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pinned Go in the server cache
        if: needs.api-changes.outputs.code == 'true'
        working-directory: .
        run: |
          cache=$CI_CACHE_DIR/${GITHUB_REPOSITORY#*/}
          dir=$cache/tools/go-$GO_VERSION
          mkdir -p "$cache/tools"
          # Download, verify and unpack once; a finished directory is renamed into place.
          if [ ! -e "$dir/.complete" ]; then
            tmp=$(mktemp -d "$cache/tools/.tmp.XXXXXX")
            curl -fsSL --retry 3 -o "$tmp/go.tgz" "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz"
            echo "$GO_SHA256  $tmp/go.tgz" | sha256sum -c --quiet -
            mkdir "$tmp/x" && tar -C "$tmp/x" --strip-components=1 -xzf "$tmp/go.tgz" && touch "$tmp/x/.complete"
            mv -T "$tmp/x" "$dir" 2>/dev/null || true
            rm -rf "$tmp"
          fi
          [ -e "$dir/.complete" ] || { echo "Go $GO_VERSION is not installed in $dir"; exit 1; }
          echo "$dir/bin" >> "$GITHUB_PATH"
          {
            echo "GOCACHE=$cache/go/build"
            echo "GOMODCACHE=$cache/go/mod"
            echo "GOTOOLCHAIN=local"
            echo "GOFLAGS=-mod=readonly"
            echo "GOTELEMETRY=off"
          } >> "$GITHUB_ENV"
      - name: PostgreSQL 17
        if: needs.api-changes.outputs.code == 'true'
        working-directory: .
        run: |
          cache=$CI_CACHE_DIR/${GITHUB_REPOSITORY#*/}
          dir=$cache/tools/postgresql-$PG_VERSION
          if [ ! -e "$dir/.complete" ]; then
            tmp=$(mktemp -d "$cache/tools/.tmp.XXXXXX")
            curl -fsSL --retry 3 -o "$tmp/pg.tgz" \
              "https://github.com/theseus-rs/postgresql-binaries/releases/download/$PG_VERSION/postgresql-$PG_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            echo "$PG_SHA256  $tmp/pg.tgz" | sha256sum -c --quiet -
            mkdir "$tmp/x" && tar -C "$tmp/x" --strip-components=1 -xzf "$tmp/pg.tgz" && touch "$tmp/x/.complete"
            mv -T "$tmp/x" "$dir" 2>/dev/null || true
            rm -rf "$tmp"
          fi
          [ -e "$dir/.complete" ] || { echo "PostgreSQL $PG_VERSION is not installed in $dir"; exit 1; }
          # Throwaway clusters and a superuser password, for this job only: pg on 5433 for
          # the tests, pg-peak on 5434 for TestPeakRSS alone. Its week publishes hold long
          # transactions, and running transactions are the cluster's: on the tests' cluster
          # they moved the events cursor bound that TestEventAnswersAfterAnEventsOnlyRefresh
          # compares (EV-CURSOR-SETTLE-1).
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          for c in pg:5433 pg-peak:5434; do
            name=${c%:*} port=${c#*:}
            (umask 077; printf '%s\n' "$pw" > "$RUNNER_TEMP/pg-pw")
            # As the framework CI's cluster (scripts/postgres_local.py): UTF-8, C locale, checksums.
            "$dir/bin/initdb" -D "$RUNNER_TEMP/$name-data" -U postgres --pwfile="$RUNNER_TEMP/pg-pw" --auth=scram-sha-256 \
              --encoding=UTF8 --locale=C --data-checksums >/dev/null
            rm -f "$RUNNER_TEMP/pg-pw"
            "$dir/bin/pg_ctl" -D "$RUNNER_TEMP/$name-data" -o "-p $port -k $RUNNER_TEMP -c listen_addresses=127.0.0.1" \
              -l "$RUNNER_TEMP/$name.log" -w start >/dev/null
            (umask 077; printf '[postgres]\nhost = "127.0.0.1"\nport = %s\nuser = "postgres"\npassword = "%s"\ndbname = "postgres"\n' \
              "$port" "$pw" > "$RUNNER_TEMP/$name-admin.toml")
          done
          {
            echo "PG_BIN=$dir/bin"
            echo "PG_TEST_ADMIN_FILE=$RUNNER_TEMP/pg-admin.toml"
            echo "PG_PEAK_ADMIN_FILE=$RUNNER_TEMP/pg-peak-admin.toml"
            echo "PG_TEST_REQUIRED=1"
          } >> "$GITHUB_ENV"
      - name: Checks in the background, tests in parallel (database)
        id: tests
        if: needs.api-changes.outputs.code == 'true'
        run: |
          EV=$RUNNER_TEMP/ev
          mkdir -p "$EV"
          echo "EV=$EV" >> "$GITHUB_ENV"
          # The step's start, for the CI time step below.
          date +%s > "$EV/step-start"
          # Each background job writes $EV/<name>.log and $EV/<name>.rc; once all have
          # finished, every one with a non-zero status prints its log and fails the step.
          background() {
            local name=$1
            shift
            ( rc=0; "$@" > "$EV/$name.log" 2>&1 || rc=$?; echo "$rc" > "$EV/$name.rc" ) &
          }
          gofmt_check() {
            local unformatted
            unformatted=$(gofmt -l .) || return 1
            [ -z "$unformatted" ] || { echo "$unformatted"; return 1; }
          }
          # go test -json into $EV/go-<name>.json, for the CI time step (every test and
          # subtest with its time); prints the tests' output as go test -v text.
          gotest() {
            local name=$1 rc=0
            shift
            go test -json "$@" > "$EV/go-$name.json" || rc=$?
            python3 ../scripts/ci/timing.py --go --log "$EV/go-$name.json"
            return "$rc"
          }
          background gofmt gofmt_check
          background vet go vet ./...
          # The Go vulnerability scan: fails on a vulnerability the code reaches. v1.1.4
          # panics on Go 1.27 code.
          background vuln go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          # TestPeakRSS on its own cluster (see the PostgreSQL step).
          peak_test() { ( export PG_TEST_ADMIN_FILE=$PG_PEAK_ADMIN_FILE; gotest peak -count=1 -v -run "$PEAK_RSS_TEST" ./internal/build/ ); }
          background slow gotest slow -count=1 -run "$SLOW_TEST" ./internal/server/
          background peak peak_test
          background tests gotest tests -count=1 -p "$(nproc)" -skip "$SLOW_TEST|$PEAK_RSS_TEST|$LATENCY_TEST|$PAGE_LATENCY_TEST" ./...
          wait

          failed=0
          for rc in "$EV"/*.rc; do
            name=$(basename "$rc" .rc)
            [ "$(cat "$rc")" = 0 ] && continue
            echo "::group::$name failed (exit $(cat "$rc"))"
            cat "$EV/$name.log"
            echo "::endgroup::"
            echo "$name failed"
            failed=1
          done
          grep -E '^(--- FAIL|ok|FAIL)' "$EV/tests.log" || true
          grep -E '^(--- |ok)' "$EV/slow.log" || true
          # Never an empty pass: the slowest test ran and passed.
          grep -qE "^--- PASS: TestEveryV4Answer " "$EV/slow.log" || { echo "TestEveryV4Answer did not pass"; failed=1; }
          grep -E 'rss: (first build|the rebuild)' "$EV/peak.log" | sed 's/^ *rss_db_test.go:[0-9]*: //' | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -qE "^--- PASS: TestPeakRSS " "$EV/peak.log" || { echo "TestPeakRSS did not pass"; failed=1; }
          exit "$failed"
      - name: go test, the latency test alone (database)
        if: needs.api-changes.outputs.code == 'true'
        run: |
          log=$EV/latency.log
          status=0
          go test -count=1 -json -run "$LATENCY_TEST" ./internal/server/ > "$EV/go-latency.json" 2> "$log" || status=$?
          python3 ../scripts/ci/timing.py --go --log "$EV/go-latency.json" >> "$log"
          if [ "$status" -ne 0 ]; then tail -n 200 "$log"; exit 1; fi
          grep -E '^(--- |ok)|p50 .* p99' "$log"
          # Never an empty pass: the test ran, measured and passed.
          grep -qE '^--- PASS: TestServeFromDatabase ' "$log"
          grep -qE 'p50 .* p99' "$log"
      - name: go test, the page latency test alone (database)
        if: needs.api-changes.outputs.code == 'true'
        run: |
          log=$EV/page-latency.log
          start=$(date +%s)
          status=0
          go test -count=1 -json -run "$PAGE_LATENCY_TEST" ./internal/server/ > "$EV/go-page-latency.json" 2> "$log" || status=$?
          python3 ../scripts/ci/timing.py --go --log "$EV/go-page-latency.json" >> "$log"
          seconds=$(( $(date +%s) - start ))
          echo "Page latency test (TestPageLatency, a production week): $seconds s, exit $status" | tee -a "$GITHUB_STEP_SUMMARY"
          # Within the CI guard but over a staging budget: warnings, so drift shows early.
          grep -oE '(STAGING-BUDGET|LATENCY-RATIO).*' "$log" | sed 's/^/- /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then tail -n 300 "$log"; exit 1; fi
          grep -E '^(--- |ok)|p99|published|rebuild' "$log"
          # Never an empty pass: the test ran, measured and passed.
          grep -qE '^--- PASS: TestPageLatency ' "$log"
          grep -qE '^--- PASS: TestFirstCoverageSearchAfterABuild ' "$log"
          grep -qE 'list cold .* p99' "$log"
      - name: CI time (slowest Go tests, budgets)
        # Also after a failed test step: the summary is there for failed runs too. Fails
        # the job when a test takes 90 s or more or the test steps over 240 s (CI-TIME-1).
        id: timing
        if: always() && needs.api-changes.outputs.code == 'true' && steps.tests.outcome != 'skipped'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 ../scripts/ci/timing.py --go --title "CI time: api Go tests"
          --start "$EV/step-start" --out "$EV/timing.json" "$EV"/go-*.json
      - name: Keep the CI time record (scripts/ci/timing_history.py --workflow api reads it)
        if: always() && steps.timing.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-timing
          path: ${{ runner.temp }}/ev/timing.json
          retention-days: 90
          if-no-files-found: ignore
      - name: go test -race without the database (nightly and dispatches)
        # After the timed test steps, so they measure only the normal tests; also
        # after a failed one. Not a merge gate: its time is reported, without limits.
        if: >-
          !cancelled() && needs.api-changes.outputs.code == 'true' && steps.tests.outcome != 'skipped'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          log=$EV/race.log
          start=$(date +%s)
          status=0
          env -u PG_TEST_ADMIN_FILE -u PG_TEST_REQUIRED go test -count=1 -race ./... > "$log" 2>&1 || status=$?
          seconds=$(( $(date +%s) - start ))
          echo "go test -race took $seconds s (exit $status)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then cat "$log"; exit 1; fi
          grep -E '^(ok|FAIL)' "$log"
          # Never an empty pass: the server package's tests ran.
          grep -qE '^ok\s+\S+/internal/server\s' "$log"
      - name: Go module check (nightly and dispatches)
        # Also after a failed test step, so a failing night still reports it. The
        # vulnerability scan runs in the tests step, on every run.
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Stop PostgreSQL
        if: always() && env.PG_BIN != ''
        working-directory: .
        run: |
          for name in pg pg-peak; do "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/$name-data" stop -m fast || true; done
