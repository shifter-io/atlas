# The API's Tier 1 (api/), on every ready pull request and every push to main
# that touches api/ or this file, and on owner dispatches: gofmt, go vet and the
# Go tests, database tests included. The commit-message, identity, secret and
# privacy checks run for every change in ci.yml's tier1.
#
# One job in three parts, all starting at once, so no dependency level is
# spent on gating; each part runs on a fresh one-job CI-SelfHosted runner
# labelled ci-2cpu. `lint`: gofmt, go vet and, on main, go test -race without
# the database. The two test parts run the Go tests
# against a throwaway PostgreSQL 17 (the framework CI's pinned build, kept in
# the server cache) loaded with the framework schema pinned in
# api/fixtures/framework/ (PIN): `tests-parts` the slowest test alone, then the
# cached-answer latency test (TestServeFromDatabase, p99 within 2 ms) alone in
# its own process, so no other package's tests share the two CPUs while it
# measures; `tests-rest` every other test. Go, the Go build cache
# and the module cache live under $CI_CACHE_DIR/<repository name>/, beside
# tier1's tools (both fill the same PostgreSQL folder, each by an atomic
# rename); the checkout is cleaned each run. A job-started hook on the servers refuses every
# job except the owner's pull requests from this repository's own branches,
# pushes to main and owner dispatches. Draft pull requests run nothing until
# they are marked ready; a change whose only API files are Markdown outside
# api/fixtures/ skips the build and tests.
name: api

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['api/**', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

# Its own group: ci.yml's `ci-` group would cancel tier1 in the same repository.
concurrency:
  group: api-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: 1.27.1
  GO_SHA256: 63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445
  # The framework CI's PostgreSQL (theseus-rs/postgresql-binaries).
  PG_VERSION: 17.11.1
  PG_SHA256: aa8e2e97574bd789119ac01f1dddcd7a038c84e5c308d7b753018618258f0fbd
  # The slowest test, run alone in its own part.
  SLOW_TEST: ^TestEveryAnswerIsTheSameFromParts$
  # The latency test, run alone after it in the same part (API-SUM-FIX-1).
  LATENCY_TEST: ^TestServeFromDatabase$

jobs:
  api:
    name: api (${{ matrix.part }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, ci-2cpu]
    strategy:
      fail-fast: false
      matrix:
        part: [lint, tests-parts, tests-rest]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Changed files
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # A dispatch has no "before": compare with the parent.
          case "$BASE" in ''|0000000000000000000000000000000000000000) BASE=HEAD~1 ;; esac
          files=$(git diff --name-only --no-renames "$BASE...HEAD")
          code=false
          while IFS= read -r f; do
            case "$f" in
              api/fixtures/*|.github/workflows/api.yml) code=true ;;
              api/*.md) ;;
              api/*) code=true ;;
              # Framework files are tier1's (ci.yml).
              *) ;;
            esac
          done <<< "$files"
          [ -n "$files" ] || code=true
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
      - name: Docs-only change
        if: steps.diff.outputs.code != 'true'
        working-directory: .
        run: echo "docs-only change; nothing to test"
      - name: Pinned Go in the server cache
        if: steps.diff.outputs.code == 'true'
        working-directory: .
        run: |
          cache=$CI_CACHE_DIR/${GITHUB_REPOSITORY#*/}
          dir=$cache/tools/go-$GO_VERSION
          mkdir -p "$cache/tools"
          # Download, verify and unpack once; a finished directory is renamed into place.
          if [ ! -e "$dir/.complete" ]; then
            tmp=$(mktemp -d "$cache/tools/.tmp.XXXXXX")
            curl -fsSL --retry 3 -o "$tmp/go.tgz" "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz"
            echo "$GO_SHA256  $tmp/go.tgz" | sha256sum -c --quiet -
            mkdir "$tmp/x" && tar -C "$tmp/x" --strip-components=1 -xzf "$tmp/go.tgz" && touch "$tmp/x/.complete"
            mv -T "$tmp/x" "$dir" 2>/dev/null || true
            rm -rf "$tmp"
          fi
          [ -e "$dir/.complete" ] || { echo "Go $GO_VERSION is not installed in $dir"; exit 1; }
          echo "$dir/bin" >> "$GITHUB_PATH"
          {
            echo "GOCACHE=$cache/go/build"
            echo "GOMODCACHE=$cache/go/mod"
            echo "GOTOOLCHAIN=local"
            echo "GOFLAGS=-mod=readonly"
            echo "GOTELEMETRY=off"
          } >> "$GITHUB_ENV"
      - name: gofmt
        if: steps.diff.outputs.code == 'true' && matrix.part == 'lint'
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - if: steps.diff.outputs.code == 'true' && matrix.part == 'lint'
        run: go vet ./...
      - name: go test -race without the database (main only; not a merge gate)
        if: steps.diff.outputs.code == 'true' && matrix.part == 'lint' && github.event_name != 'pull_request'
        run: go test -count=1 -race ./...
      - name: PostgreSQL 17 and the pinned framework schema
        if: steps.diff.outputs.code == 'true' && matrix.part != 'lint'
        working-directory: .
        run: |
          # The pinned schema files must be the ones PIN names.
          (cd api/fixtures/framework && grep -E '^[0-9a-f]{64}  ' PIN | sha256sum -c --strict -)
          cache=$CI_CACHE_DIR/${GITHUB_REPOSITORY#*/}
          dir=$cache/tools/postgresql-$PG_VERSION
          if [ ! -e "$dir/.complete" ]; then
            tmp=$(mktemp -d "$cache/tools/.tmp.XXXXXX")
            curl -fsSL --retry 3 -o "$tmp/pg.tgz" \
              "https://github.com/theseus-rs/postgresql-binaries/releases/download/$PG_VERSION/postgresql-$PG_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            echo "$PG_SHA256  $tmp/pg.tgz" | sha256sum -c --quiet -
            mkdir "$tmp/x" && tar -C "$tmp/x" --strip-components=1 -xzf "$tmp/pg.tgz" && touch "$tmp/x/.complete"
            mv -T "$tmp/x" "$dir" 2>/dev/null || true
            rm -rf "$tmp"
          fi
          [ -e "$dir/.complete" ] || { echo "PostgreSQL $PG_VERSION is not installed in $dir"; exit 1; }
          # A throwaway cluster and superuser password, for this job only.
          data=$RUNNER_TEMP/pg-data
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          (umask 077; printf '%s\n' "$pw" > "$RUNNER_TEMP/pg-pw")
          # As the framework CI's cluster (scripts/postgres_local.py): UTF-8, C locale, checksums.
          "$dir/bin/initdb" -D "$data" -U postgres --pwfile="$RUNNER_TEMP/pg-pw" --auth=scram-sha-256 \
            --encoding=UTF8 --locale=C --data-checksums >/dev/null
          rm -f "$RUNNER_TEMP/pg-pw"
          "$dir/bin/pg_ctl" -D "$data" -o "-p 5433 -k $RUNNER_TEMP -c listen_addresses=127.0.0.1" -l "$RUNNER_TEMP/pg.log" -w start >/dev/null
          admin=$RUNNER_TEMP/pg-admin.toml
          (umask 077; printf '[postgres]\nhost = "127.0.0.1"\nport = 5433\nuser = "postgres"\npassword = "%s"\ndbname = "postgres"\n' "$pw" > "$admin")
          {
            echo "PG_BIN=$dir/bin"
            echo "PG_TEST_ADMIN_FILE=$admin"
            echo "PG_TEST_FRAMEWORK_DIR=$GITHUB_WORKSPACE/api/fixtures/framework"
            echo "PG_TEST_REQUIRED=1"
          } >> "$GITHUB_ENV"
      - name: go test, the slowest test (database)
        if: steps.diff.outputs.code == 'true' && matrix.part == 'tests-parts'
        run: |
          log=$RUNNER_TEMP/slow.log
          if ! go test -count=1 -v -run "$SLOW_TEST" ./internal/server/ > "$log" 2>&1; then tail -n 200 "$log"; exit 1; fi
          grep -E '^(--- |ok)' "$log"
          # Never an empty pass: the test ran and passed.
          grep -qE '^--- PASS: TestEveryAnswerIsTheSameFromParts ' "$log"
      - name: go test, the latency test alone (database)
        if: steps.diff.outputs.code == 'true' && matrix.part == 'tests-parts'
        run: |
          log=$RUNNER_TEMP/latency.log
          if ! go test -count=1 -v -run "$LATENCY_TEST" ./internal/server/ > "$log" 2>&1; then tail -n 200 "$log"; exit 1; fi
          grep -E '^(--- |ok)|p50 .* p99' "$log"
          # Never an empty pass: the test ran, measured and passed.
          grep -qE '^--- PASS: TestServeFromDatabase ' "$log"
          grep -qE 'p50 .* p99' "$log"
      - name: go test, every other test (database)
        if: steps.diff.outputs.code == 'true' && matrix.part == 'tests-rest'
        run: go test -count=1 -skip "$SLOW_TEST|$LATENCY_TEST" ./...
      - name: Stop PostgreSQL
        if: always() && env.PG_BIN != ''
        working-directory: .
        run: '"$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/pg-data" stop -m fast || true'
