# Maestro nightly: known-vulnerable dependencies. A failure becomes an issue; it never blocks PRs.
# Audits every package in uv.lock (extras and the dev group included) at its locked version.
# uv and its CPython are pinned like ci.yml's (tests/test_ci_nightly.py keeps the pins equal)
# and cached in the same server folder, so the server's Python, which has no pip, is never used.
name: maestro-nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: 0.12.10
  UV_SHA256: 173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b
  PYTHON_VERSION: 3.12.14
  PIP_AUDIT_VERSION: 2.9.0
jobs:
  audit:
    runs-on: [self-hosted, ci-2cpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pinned uv in the server cache
        # ci.yml's download pattern: verify, unpack, then rename a finished directory into place.
        run: |
          tools=$CI_CACHE_DIR/proxy-index/tools
          dest=$tools/uv-$UV_VERSION
          mkdir -p "$tools"
          if [ ! -e "$dest/.complete" ]; then
            tmp=$(mktemp -d "$tools/.tmp.XXXXXX")
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL --retry 3 -o "$tmp/a.tgz" \
              "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
            echo "$UV_SHA256  $tmp/a.tgz" | sha256sum -c --quiet -
            mkdir "$tmp/x"
            tar -C "$tmp/x" --strip-components=1 -xzf "$tmp/a.tgz"
            touch "$tmp/x/.complete"
            mv -T "$tmp/x" "$dest" 2>/dev/null || true
          fi
          echo "$dest" >> "$GITHUB_PATH"
          {
            echo "UV_CACHE_DIR=$CI_CACHE_DIR/proxy-index/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=$tools/python"
          } >> "$GITHUB_ENV"
      - name: Export the locked dependencies
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: Dependency audit
        run: |
          uvx --python "$PYTHON_VERSION" --from "pip-audit==$PIP_AUDIT_VERSION" pip-audit \
            -r "$RUNNER_TEMP/requirements.txt" --require-hashes --no-deps --disable-pip
