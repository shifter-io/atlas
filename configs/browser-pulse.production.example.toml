# Production browser pulse settings (schema 2): the manager's and the three minis' daily queue
# (BROWSER-HOSTS-SETTINGS-1). No secrets and no real inputs: the private file is a copy of this
# one with the real inputs and enabled = true (docs/browser.html, "Manager runbook").
# Every field is described in browser-pulse.example.toml.
schema = 2
enabled = false                 # true only in the private file, once the hosts are ready

[schedule]
countries = ["US"]
lead_seconds = 60
plan = "queue"                  # each host's daily queue (K-BP5)
queue_period_minutes = 1440     # every (network, target) once a UTC day
run_deadline_minutes = 180

[browser]
browsers_per_host = 2           # 2 on each mini: a load of about 76%
recycle_after = 1               # a new browser profile per request, on both engines
page_timeout_s = 45
headless = true
block_resources = ["image", "media", "font"]
screenshots = "failures"
locale = "en-US"
engine = "camoufox"             # targets without their own engine

[chrome]
executable = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"   # the default

[outbox]
dir = "outbox"
max_pending_gb = 20

# The 9 targets: 100 tries per network once a day, on the owner's engine, with the measured
# browser-seconds of one run on that engine (the queue's order and load check). Inputs are
# placeholders; the real ones live only in the private file.

[[target]]
id = "amazon_pdp"
tries = 100
every_minutes = 1440
engine = "chrome"
browser_seconds = 1450
inputs = ["0306406152"]

[[target]]
id = "google_search"
tries = 100
every_minutes = 1440
engine = "camoufox"
browser_seconds = 1350
inputs = ["example query"]

[[target]]
id = "linkedin_public"
tries = 100
every_minutes = 1440
engine = "chrome"
browser_seconds = 2760
inputs = ["example"]

[[target]]
id = "instagram_web"
tries = 100
every_minutes = 1440
engine = "chrome"
browser_seconds = 2520
inputs = [{site = "instagram", handle = "example"}]

[[target]]
id = "x_web"
tries = 100
every_minutes = 1440
engine = "camoufox"
browser_seconds = 710
inputs = ["example"]            # X handles

[[target]]
id = "cloudflare_challenge"
tries = 100
every_minutes = 1440
engine = "camoufox"
browser_seconds = 4520
challenge_wait_s = 20
inputs = [{url = "https://example.com/protected", expect = "Example Domain"}]

[[target]]
id = "ai_overview"
tries = 100
every_minutes = 1440
engine = "camoufox"
browser_seconds = 1470
answer_wait_s = 30
inputs = ["example question"]

[[target]]
id = "ai_chatgpt"
tries = 100
every_minutes = 1440
engine = "camoufox"
browser_seconds = 5800
answer_wait_s = 60
block_resources = []
inputs = ["example question"]   # exactly one fixed question

[[target]]
id = "ai_gemini"
tries = 100
every_minutes = 1440
engine = "chrome"
browser_seconds = 1360
timeout_s = 60
answer_wait_s = 60
inputs = ["example question"]   # exactly one fixed question

# The three minis, 6 networks each, as in the 24-hour run (BP-VERIFY-3). Logical names only.
[[host]]
name = "browser-1"
networks = [
  "decodo/residential",
  "geonode/residential",
  "iproyal/residential",
  "oxylabs/residential",
  "shifter/residential",
  "soax/residential",
]

[[host]]
name = "browser-2"
networks = [
  "dataimpulse/residential",
  "evomi/residential",
  "infatica/residential",
  "massive/residential",
  "nodemaven/residential",
  "webshare/residential",
]

[[host]]
name = "browser-3"
networks = [
  "byteful/residential",
  "fleetproxy/residential",
  "proxy-cheap/residential",
  "proxy-seller/residential",
  "proxyempire/residential",
  "rayobyte/residential",
]

[networks]
untargeted = ["proxy-cheap/residential"]   # no country flag (D11), as in the 24-hour run
