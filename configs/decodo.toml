# Decodo (formerly Smartproxy) Residential. https://help.decodo.com/docs/residential-proxy-quick-start
# Never put account credentials in this file.
# Credential grammar: src/atlas/providers/grammars/decodo.toml
schema_version = 1
provider = "decodo"

[credentials]
account_env = "DECODO_ACCOUNT"
password_env = "DECODO_PASSWORD"

[settings]
scheme = "http" # http or socks5
# session_policy = "per_request" # rotate, fixed, per_request, per_worker, per_run

[parameters]
# All optional; None omits a value. A session implies fixed sessions.
# country = "us"
# region = "california"
# city = "los_angeles"
# zip = "90001"
# asn = 7922
# session = "example1"
# ttl = 10 # Minutes; requires a session
