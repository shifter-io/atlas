# FleetProxy Residential. https://fleetproxy.io/
# Never put account credentials in this file.
# Credential grammar: src/atlas/providers/grammars/fleetproxy.toml
schema_version = 1
provider = "fleetproxy"

[credentials]
account_env = "FLEETPROXY_ACCOUNT"
password_env = "FLEETPROXY_PASSWORD"

[settings]
scheme = "http" # http
# session_policy = "per_request" # rotate, fixed, per_request, per_worker, per_run

[parameters]
# All optional; None omits a value. A session implies fixed sessions.
# country = "us"
# region = "california"
# city = "los_angeles"
# session = "example1"
# ttl = 10 # Minutes; requires a session
