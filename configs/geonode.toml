# Geonode Residential. Credentials live in .secrets/geonode-credentials.toml.
# Operational notice (2026-10-07): Geonode HTTP 469 is a rate-limit response.
# Retrying at 2500 concurrency/server against checkip.amazonaws.com still produced
# 91.45% HTTP 469 across eight bounded probes (including replacement attempts).
# For the agreed census policy, exclude 469 from the minimum sample and 50%
# unique/request denominator, retry within the run deadline, and report 469 / all
# completed attempts separately. Keep other failures in the census denominator.
# This provider TOML does NOT enable retries: the run caller must opt in and its
# recorded metadata must confirm the policy (onboarding plan --retry-http-469).
# Limited networks can use --execution-mode sequential: 24 hours per region.
# See docs/onboarding.html#geonode-469
# for implementation availability, limits and the pre-campaign verification gate.
schema_version = 1
provider = "geonode"

[credentials]
account_env = "GEONODE_ACCOUNT" # Base ID, optionally prefixed with geonode_
password_env = "GEONODE_PASSWORD"

[settings]
scheme = "http" # Supports HTTP and HTTPS targets via CONNECT.
host = "proxy.geonode.io"
port = 10000 # Supplied sticky endpoint; rotating HTTP uses 9000.
# session_policy = "per_request" # gateway, rotate, fixed, per_request, per_worker, per_run

[parameters]
strict = true # Encodes as -strict-on; the live gateway rejects bare -strict.
# country = "us"
# region = "california" # Sent as state-; exact provider token; requires country.
# city = "losangeles" # Exact provider token; cannot combine with state.
# asn = 7922 # Requires country.
# session = "example_session" # 1–25 alphanumeric/underscore characters.
# ttl = 10 # Minutes, 3–1440; sent as lifetime-; sticky ports only.

[extra_flags]
# Unknown flags are rejected until their semantics are explicitly implemented.
