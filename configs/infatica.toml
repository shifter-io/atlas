# Infatica Residential. https://infatica.io/documentation/
# Never put account credentials in this file.
# Credential grammar: src/proxy_index/providers/grammars/infatica.toml
schema_version = 1
provider = "infatica"

[credentials]
account_env = "INFATICA_ACCOUNT"
password_env = "INFATICA_PASSWORD"

[settings]
scheme = "http" # http or socks5
# port = 10000
# session_policy = "per_request" # rotate, fixed, per_request, per_worker, per_run

[parameters]
# All optional; None omits a value. A session implies fixed sessions.
# country = "us"
# city = "Los Angeles"
# asn = 7922
# zip = "90001"
# session = "example1"
# ttl = 10 # Minutes; requires a session
