# Massive Residential. https://docs.joinmassive.com/residential/
# Never put account credentials in this file.
# Credential grammar: src/atlas/providers/grammars/massive.toml
schema_version = 1
provider = "massive"

[credentials]
account_env = "MASSIVE_ACCOUNT"
password_env = "MASSIVE_PASSWORD"

[settings]
scheme = "http" # http or socks5
# session_policy = "per_request" # rotate, fixed, per_request, per_worker, per_run

[parameters]
# All optional; None omits a value. A session implies fixed sessions.
# country = "us"
# region = "CA" # Subdivision code
# city = "Los Angeles"
# zip = "90001"
# asn = 7922
# type = "mobile"
# session = "example1"
# ttl = 10 # Minutes; requires a session
