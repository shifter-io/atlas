name = "Measured draft v2"
status = "draft"
windows = [24, 168, 720]
refresh_seconds = 60
required_targets = ["generic_http", "generic_https"]
# Every request counts for every metric: census, pulse and load runs (and runs outside a batch)
# all feed success, blocks, timeouts, exit IPs, geography/ASN breakdowns and bytes. Run roles
# (calculation_roles) are display labels only. minimum_requests counts every request of a
# required target in the window.
minimum_requests = 4000
minimum_coverage = 0.90
score_valid_hours = 24
# minimum_coverage: for unbatched runs, the share of 5-minute buckets with data. For census/pulse
# (batch-linked) cohorts it is the share of the product's pulse slots in the window that it filled:
# slots are the product's 'done' pulse runs. A run is only ever 'failed' by our side (no node,
# never started, went silent, node shut down or erred, upload rejected), so failed runs and
# operator-skipped or killed batches are never slots and never count against the provider. A slot
# is filled by a run with at least one request, also when every request failed: a provider that is
# down is data (filled and down: it lowers success and uptime), not a gap.
# sample_limit is unused: windows no longer carry ip_samples. It stays so that the methodology id
# (a digest of these settings) does not change.
sample_limit = 50
# The one target every latency figure is measured on: light-load and under-load latency, the speed
# score, breakdown latency and the load factor. Other targets count for success, blocks,
# timeouts, IPs, authenticity, dcAsns, bytes and uptime, never for those latency figures. Every
# other HTTP target has a display-only light-load latency of its own successes (its targets[]
# latency_ms, same slot rule; no score reads it); a browser target has none. It must be a
# required target; the census target, which the load wave runs on.
latency_target = "generic_http"
# DB-IP usage types that mark an exit IP as a datacenter/hosting address: dcAsns, and the
# new_hosting_asn tape event. Exit IPs without a usage type are left out of every share.
hosting_usage_types = ["hosting", "datacenter"]

# Time-weighted window metrics. A window is split into time slots: the cohort's pulse interval
# (the shortest pulse_interval_minutes of the pulse-enabled targets) made a whole multiple of the
# 5-minute stored bucket, lcm(interval, 5): 30 minutes in production, 10 in staging (2-minute
# pulses), so a census request is never placed in a slot it did not run in. Pulse and load
# requests belong to their batch's slot, census and unbatched requests to the slot they ran in.
# Every slot with observed requests weighs the same: success rate = mean of the slot success
# rates (successes / requests observed in the slot; nothing is counted for requests nobody
# observed). Light-load latency (pulses of latency_target only; census and load runs run at
# census concurrency) merges the slots' latency histograms after normalising each to weight 1,
# then reads p50/p90/p99 from the merged distribution; a slot with fewer than
# min_latency_successes successes does not vote. Percentiles are never averaged.
#
# Census overlap: a pulse or load run of a product that ran while a census of the same product was
# running (any country: the account and the node are shared) is marked during_census, derived at
# calculation time from stored run start and finish times (the ingested run's, else the
# orchestrator's). It still runs, fills its slot, counts for uptime, outages and down slots, and
# its requests count for every request metric. It is left out of light-load latency (also in the
# breakdowns), of the time-slot success (a slot votes with its other requests; one left with
# only such pulses votes 0 if every request in it failed and does not vote otherwise), and of the
# load factor (a factor needs a clean load run and a clean reference pulse; otherwise the newest
# earlier factor carries forward). Snapshot: census_overlap per window.
#
# Latency under load (the speed score): in every pulse slot each product also runs one wave at
# the census target's census_concurrency in every runner region's reference country: a batch of
# kind 'load', started load.delay_seconds (60) after the pulses so the reference pulse stays a
# light-load measurement. The orchestrator picks each region's reference once per UTC day and
# stores it (load_references): the fastest country tested from the region over the trailing
# load.reference_days (lowest light-load p50 of its clean census-target pulses, at least
# load.reference_min_successes successes, ties by country code), an override
# (load.reference_overrides), else the region's default without history
# (load.reference_defaults; staging fra1: RO), else its first enabled country. Per percentile,
#   factor(R, t) = load-run latency(R, t) / pulse latency of R's reference country(t),
#   under-load latency(C, t) = pulse latency(C, t) x factor(region of C, t).
# Both runs need min_latency_successes successes. A slot without a usable load run uses the
# region's newest earlier factor in the window; with none, that country's slot has no
# under-load value. The window's under-load latency is the mean over slots and countries.
# Census latency never makes a factor. Example: fra1's reference RO, RO pulse 600 ms, RO load
# 900 ms -> x1.5; a Bulgarian pulse (BG is tested from fra1) of 800 ms -> 1,200 ms under load.
[slots]
min_latency_successes = 30

# Uptime is outage time: 1 - downtime / (window length x countries the product was tested in during
# the window), where downtime sums, per country, the union of its outages clipped to the window (one
# still open runs to the cutoff). Outages open when a pulse reports a product down (a done run
# without a success, from its last healthy pulse there) or a census stalls (no
# success for census.stall_seconds after it had some; from its last success), and close with the
# next healthy pulse or census in the country. Load runs never count for uptime.
# min_successes still defines an "up" pulse batch for the reference counts (uptime.batches/up).
# Uptime feeds the uptime score component once min_batches pulse batches finished in the window;
# until then uptime_pct evidence, if any, is used instead.
[uptime]
min_successes = 1
min_batches = 10

# Published snapshot size: each breakdown and pool list keeps its top rows (by requests, pool lists
# by IPs) and its full row count (breakdown_entries, pool.list_entries); totals and
# calculated_list_rows stay whole. Defaults in calculated/policy.py PAYLOAD (country lists 1000,
# region/city/asn/country_asn/city_asn 25, geo/asns_breakdown 50). An optional [payload] table
# (e.g. city_asn = 100) overrides them and, like any setting here, changes the methodology id.

# Live tape detection (proxy_index.detect). Not part of the methodology id: changing these
# never changes a calculation. Rates are fractions; *_pp are percentage points as fractions.
[events]
baseline_batches = 48         # trailing pulse batches of the same product, country and target
min_baseline_batches = 6      # fewer: no success, block or latency comparison yet
min_requests = 20             # smaller pulses are not judged
min_latency_samples = 10      # successes needed before a latency spike counts
success_drop_pp = 0.15        # success rate below baseline - 15 pp
latency_spike_ratio = 2.0     # median latency above 2x the baseline median
block_spike_pp = 0.10         # challenge + block share above baseline + 10 pp
down_baseline = 0.5           # no success at all while the baseline was above 50%
pulse_change_pp = 0.05        # pulse_finished only when success moved 5 pp from the last pulse,
pulse_latency_ratio = 1.5     # the median latency moved 1.5x, or challenges/blocks appeared/went
settle_seconds = 120          # batches finished this recently wait for the next run
initial_lookback_minutes = 60 # first run without a watermark

[weights]
reliability = 22
speed = 14
uptime = 10
coverage = 12
diversity = 8
dcAsns = 10
authenticity = 10
value = 14

# A target score mixes its reliability and speed ratios; only latency_target has a speed, so any
# other target's score is its reliability ratio.
[target_weights]
reliability = 80
speed = 20

# Reliability (only) averages the required targets' ratios with these weights.
[benchmark_weights]
generic_http = 1
generic_https = 1

# Every component is a ratio to the leader: the best raw value among the products of the same kind
# in the same window whose component is ready (state "ready", measured, not retained or expired).
# Higher is better: 100 x yours / best; lower is better (speed, value): 100 x best / yours.
# Clamped to 0-100; a product alone in its kind scores 100. Leaders are found again on every
# calculation. Raw values:
#   reliability   time-weighted success rate of every request (per target, averaged with
#                 benchmark_weights); blocks, challenges and timeouts are failures inside it
#                 (block rate is published, not a separate component)
#   speed         p50 latency under load of latency_target alone
#   uptime        outage-time uptime percent
#   coverage      unique exit IPs per day
#   diversity     countries, regions, cities, ASNs per day ([peer.diversity])
#   dcAsns        clean share: 1 - share of exit IPs with a DB-IP usage type whose type is in
#                 hosting_usage_types (unknowns excluded; datacenter products keep 100)
#   authenticity  100 x share of exit IPs whose DB-IP country is the country the requests asked
#                 for (pool geo_accuracy, per unique IP, IPs without a DB-IP country excluded)
#   value         lowest list price per GB of the pool tested (effective-dated price evidence,
#                 price_per_gb_lowest), so value = 100 x cheapest of the kind / yours
# Pool counts (coverage, diversity) are averages of daily (24h) counts over the window's days with
# observations, so a network measured for a few days compares fairly with one measured for 30.
[peer.diversity]
# Diversity mixes the ratios of the four pool dimensions with these weights (sum to one).
countries = 0.30
regions = 0.20
cities = 0.25
asns = 0.25

[grades]
"A+" = 88
A = 80
"B+" = 72
B = 64
"C+" = 56
C = 48
D = 0

[profiles.balanced]
reliability = 22
speed = 14
uptime = 10
coverage = 12
diversity = 8
dcAsns = 10
authenticity = 10
value = 14
[profiles.latency_first]
reliability = 16
speed = 38
uptime = 8
coverage = 8
diversity = 6
dcAsns = 6
authenticity = 6
value = 12

# Group targets (browser pulse): a group target is measured over the union of its sources'
# requests and is never scheduled itself. Each source keeps its own entry, with the group named.
# Browser targets are per-target only: their runs never enter a network's window metrics, census
# overlap, series, uptime, coverage, scores, fleet totals or breakdowns (calculated/browser.py),
# so no browser target is a required target.
[target_groups]
ai_answers = ["ai_overview", "ai_chatgpt", "ai_gemini"]

# Target difficulty, 1 (easy) to 5 (hard): FIXED values the owner set on 2026-11-12. They are
# never derived from results (success rates, ranks or outcomes) and change only on the owner's
# word. tests/test_target_difficulty.py holds them and fails on any drift (this file, the site
# catalog api/scripts/catalog-targets.sql, the served /v1/meta fixture).
# [browser_difficulty]: the weight of a browser target's success score in a network's overall
# browser score (calculated/target_scores.py). Every run target needs one; a group without one
# takes its hardest source's. The overall counts the page targets and each group, never a
# group's sources.
[browser_difficulty]
amazon_pdp = 2
instagram_web = 3
google_search = 4
cloudflare_challenge = 4
linkedin_public = 5
ai_answers = 5
ai_overview = 5
ai_chatgpt = 5
ai_gemini = 5

# [http_difficulty]: each HTTP target's weight in the all-targets success score
# (target_scores.py success_overall). It is not part of the browser overall.
[http_difficulty]
generic_http = 1
generic_https = 1

# Optional overrides: [products."provider/product"] and [targets.target_id].
# Override weights, target_weights, peer, required_targets or eligibility settings.
# Product settings are applied first; target settings take precedence for target scores.
# kind sets a product's peer group (residential, datacenter, isp, mobile, ...); without it the
# product name is the kind, so "<provider>/residential" products compare with each other.
[products."shifter/residential"]
kind = "residential"
display_name = "Shifter"
