name = "Measured draft v2"
status = "draft"
windows = [24, 168, 720]
refresh_seconds = 60
required_targets = ["generic_http", "generic_https"]
# Every request counts for every metric: census, pulse and load runs (and runs outside a batch)
# all feed success, blocks, timeouts, exit IPs, geography/ASN breakdowns and bytes. Run roles
# (calculation_roles) are display labels only. minimum_requests counts every request of a
# required target in the window.
minimum_requests = 4000
minimum_coverage = 0.90
score_valid_hours = 24
# minimum_coverage: for unbatched runs, the share of 5-minute buckets with data. For census/pulse
# (batch-linked) cohorts it is the share of the product's pulse slots in the window that it filled:
# slots are the product's 'done' pulse runs. A run is only ever 'failed' by our side (no node,
# never started, went silent, node shut down or erred, upload rejected), so failed runs and
# operator-skipped or killed batches are never slots and never count against the provider. A slot
# is filled by a run with at least one request, also when every request failed: a provider that is
# down is data (filled and down: it lowers success and uptime), not a gap.
# sample_limit is unused: windows no longer carry ip_samples. It stays so that the methodology id
# (a digest of these settings) does not change.
sample_limit = 50
# The one target every latency figure is measured on: the latency of normal requests and under
# load, the speed score (speed_latency below) and breakdown latency. Other targets count for success, blocks,
# timeouts, IPs, authenticity, dcAsns, bytes and uptime, never for those latency figures. Every
# other HTTP target has a display-only light-load latency of its own successes (its targets[]
# latency_ms, same slot rule; no score reads it); a browser target has none. It must be a
# required target; the daily test's and the census target.
latency_target = "generic_http"
# The latency the speed component reads, the p50 of latency_target's: "light_load" (latency_ms,
# its pulses: the same small test for every network every slot) or "under_load" (its daily
# tests, census and load runs, which mix each network's country mix and test sizes). The owner's
# decision of 2026-11-16 (SPEED-PULSE-1): light load. Under load stays published, display only.
speed_latency = "light_load"
# DB-IP usage types that mark an exit IP as a datacenter/hosting address: dcAsns, and the
# new_hosting_asn tape event. Exit IPs without a usage type are left out of every share.
hosting_usage_types = ["hosting", "datacenter"]
# A browser target counts for a network only with browser_min_requests completed tries of its
# engine in the window, each window (24h, 7d, 30d) its own: under it the network's success,
# challenge and block scores of that target are not_enough_data, so the target is left out of
# the network's overall scores (challenge_overall, browser_overall; success_overall reads no
# browser target) and is no peer in that target's ranking. The owner's decision of 2026-11-16 (#1232): 100, one
# run, the same as the HTTP targets' target_scores.MIN_REQUESTS. It was 500 (about five runs,
# #1134, 2026-11-15), after one LinkedIn run of 100 requests had moved a network's overall score
# from rank 1 to rank 12 in an hour; but every network has only 100 to 300 tries per browser
# target in 7 days, so under 500 no browser target was scored at all. The trade-off, known: one
# run of 100 requests can again move a network's overall browser score a lot.
browser_min_requests = 100
# A network's country counts only while its latest daily test there found at least 10 unique IPs
# (the owner's decision of 2026-11-15, #1137): each daily test is a verdict (country_verdicts,
# schema v16) that holds until the next daily test of the network and country; before a
# country's first daily test it does not count. Everything measured for the network in a
# country while it does not count is left out of every figure (requests, success, latency, IPs,
# breakdowns, pulse slots, coverage, outages and uptime, estimates, scores); nothing is deleted.
# Without this setting every country counts.
country_verdicts = true

# Time-weighted window metrics. A window is split into time slots: the cohort's pulse interval
# (the shortest pulse_interval_minutes of the pulse-enabled targets) made a whole multiple of the
# 5-minute stored bucket, lcm(interval, 5): 30 minutes in production, 10 in staging (2-minute
# pulses), so a census request is never placed in a slot it did not run in. Pulse and load
# requests belong to their batch's slot, census and unbatched requests to the slot they ran in.
# Every slot with observed requests weighs the same: success rate = mean of the slot success
# rates (successes / requests observed in the slot; nothing is counted for requests nobody
# observed). Two latencies of latency_target, each merging the slots' latency histograms after
# normalising each to weight 1, then reading p50/p90/p99 from the merged distribution; a slot with
# fewer than min_latency_successes successes does not vote. Percentiles are never averaged.
#   Normal requests (latency_ms; light load; the speed score): its pulses (pulse_concurrency, 25).
#   Under load (latency_under_load_ms; the headline, display only, no score reads it): its daily
#   country tests (runs outside a batch, concurrency 2000, 500 for two networks), census and load
#   runs.
# Speed without enough pulses: a network with no pulse slot of min_latency_successes successes
# outside a census in the window (none pulsed, too few successes per slot, or every such pulse
# ran during a census) has no speed ("No pulse with enough successes in this window"), so its
# speed and its score are not ready, as a missing latency always was. Budgeted pulses (fewer
# countries or slots) still vote: each slot that has the successes weighs the same.
#
# Census overlap: a pulse or load run of a product that ran while a census of the same product was
# running (any country: the account and the node are shared) is marked during_census, derived at
# calculation time from stored run start and finish times (the ingested run's, else the
# orchestrator's). It still runs, fills its slot, counts for uptime, outages and down slots, and
# its requests count for every request metric. It is left out of both latencies (also of the
# breakdowns' latency) and of the time-slot success (a slot votes with its other requests; one
# left with only such pulses votes 0 if every request in it failed and does not vote otherwise).
# Snapshot: census_overlap per window.
#
# Load waves (staging; off in production): in every pulse slot each product also runs one wave at
# the census target's census_concurrency in every runner region's reference country (kind
# 'load', load.delay_seconds after the pulses; reference chosen daily into load_references). Its
# requests count under load like a daily test's; no factor scales the pulses any more.
[slots]
min_latency_successes = 30

# Uptime is outage time over the measured time (basis = "measured_time"): 1 - the sum over the
# countries tested in the window of their downtime clipped to their measured span / the sum of
# their measured spans. A country's measured span runs from the start of its first tested run (a
# started run of any kind but load and browser) to the end of its last one, clipped to the window;
# a window without measured time has no uptime. Its downtime is the union of its outages (one
# still open runs to the cutoff). Example: 13.2 min down in a country measured for 2 of a 7-day
# window's days: 1 - 13.2 / 2,880 = 99.54% (the "window" basis divides by the window length
# per country tested: 1 - 13.2 / 10,080 = 99.87%). Outages open when a pulse reports a product
# down (a done run without a success, from its last healthy pulse there) or a census stalls (no
# success for census.stall_seconds after it had some; from its last success), and close with the
# next healthy pulse or census in the country. Load runs never count for uptime.
# min_successes still defines an "up" pulse batch for the reference counts (uptime.batches/up).
# Uptime feeds the uptime score component once min_batches pulse batches finished in the window;
# until then uptime_pct evidence, if any, is used instead.
[uptime]
min_successes = 1
min_batches = 10
basis = "measured_time"

# Published snapshot size: each breakdown and pool list keeps its top rows (by requests, pool lists
# by IPs) and its full row count (breakdown_entries, pool.list_entries); totals and
# calculated_list_rows stay whole. Defaults in calculated/policy.py PAYLOAD (country lists 1000,
# region/city/asn/country_asn/city_asn 25, geo/asns_breakdown 50). An optional [payload] table
# (e.g. city_asn = 100) overrides them and, like any setting here, changes the methodology id.

# Live tape detection (atlas.detect). Not part of the methodology id: changing these
# never changes a calculation. Rates are fractions; *_pp are percentage points as fractions.
[events]
baseline_batches = 48         # trailing pulse batches of the same product, country and target
min_baseline_batches = 6      # fewer: no success, block or latency comparison yet
min_requests = 20             # smaller pulses are not judged
min_latency_samples = 10      # successes needed before a latency spike counts
success_drop_pp = 0.15        # success rate below baseline - 15 pp
latency_spike_ratio = 2.0     # median latency above 2x the baseline median
block_spike_pp = 0.10         # challenge + block share above baseline + 10 pp
down_baseline = 0.5           # no success at all while the baseline was above 50%
pulse_change_pp = 0.05        # pulse_finished only when success moved 5 pp from the last pulse,
pulse_latency_ratio = 1.5     # the median latency moved 1.5x, or challenges/blocks appeared/went
settle_seconds = 120          # batches finished this recently wait for the next run
initial_lookback_minutes = 60 # first run without a watermark

[weights]
reliability = 22
speed = 14
uptime = 10
coverage = 12
diversity = 8
dcAsns = 10
authenticity = 10
value = 14

# A target score mixes its reliability and speed ratios; only latency_target has a speed, so any
# other target's score is its reliability ratio.
[target_weights]
reliability = 80
speed = 20

# Reliability (only) averages the required targets' ratios with these weights.
[benchmark_weights]
generic_http = 1
generic_https = 1

# Every component but value is a ratio to the leader: the best raw value among the products of the
# same kind in the same window whose component is ready (state "ready", measured, not retained or
# expired). Higher is better: 100 x yours / best; lower is better (speed): 100 x best / yours.
# Clamped to 0-100; a product alone in its kind scores 100. Leaders are found again on every
# calculation. Value scores by place ([value] below). Raw values:
#   reliability   time-weighted success rate of every request (per target, averaged with
#                 benchmark_weights); blocks, challenges and timeouts are failures inside it
#                 (block rate is published, not a separate component)
#   speed         p50 latency of latency_target alone, of its pulses (light load, latency_ms;
#                 speed_latency); the latency under load feeds no score
#   uptime        outage-time uptime percent
#   coverage      unique exit IPs per day
#   diversity     countries, regions, cities, ASNs per day ([peer.diversity])
#   dcAsns        clean share: 1 - share of exit IPs with a DB-IP usage type whose type is in
#                 hosting_usage_types (unknowns excluded; datacenter products keep 100)
#   authenticity  100 x share of exit IPs whose DB-IP country is the country the requests asked
#                 for (pool geo_accuracy, per unique IP, IPs without a DB-IP country excluded)
#   value         the all-targets cost: the bill per 1,000 successful requests over the card
#                 targets (the HTTP targets and the browser targets and groups that are not a
#                 group's source, 8 today), equal weights; each target's cost is every wire byte
#                 of its finished tries (failed ones too) at the lowest list price per GB of the
#                 pool tested (effective-dated price evidence, price_per_gb_lowest; GB = 10^9
#                 bytes) / its successes x 1,000 (the site API's costPer1kAllTargets)
# Pool counts (coverage, diversity) are averages of daily (24h) counts over the window's days with
# observations, so a network measured for a few days compares fairly with one measured for 30.
# Value by place (basis "rank_all_targets", calculated/value_all.py): every product of the kind in
# the window with an all-targets cost is ranked, cheapest first, whatever its freshness; ties share
# the rank (1 + those strictly cheaper). With N ranked, rank r scores 100 x (N - r + 1) / N: #1 of
# 18 is 100, #3 88.9, #18 5.6. A card target with tries but no successes is costed at the highest
# cost any product of the kind has on it in the window, and the bill is then a lower bound
# ("cost_is_lower_bound"), ranked like the others (the owner's rule, 2026-11-13). One without a
# price, or with a card target without a run or wire bytes, is null with its reason and not
# counted in N. The component publishes the bill, the partial bill, the counted and missing
# targets, the lower-bound flag and its rank ("rank", "ranked": N), which the site API serves as
# costPer1kAllTargets, costIsLowerBound and valueRankAllTargets. Basis "rank" ranks the HTTP cost
# per 1,000 successful requests instead (calculated/value_rank.py); basis "ratio" (the default
# without this table) scores 100 x the cheapest list price per GB of the kind / yours.
# price is the $/GB every cost uses (COST-BASIS-200GB-1, the owner's item 15): "first_200gb_plan"
# is the network's first plan of 200 GB or more (monthly or pay as you go, the cheaper at that
# size; annual commitments and custom quotes do not count), else its largest plan with a stated
# GB: the price_per_gb_basis evidence. Without it the product is unpriced ("no_basis_price"),
# never priced at another rate. "lowest" (the default without this key) is price_per_gb_lowest.
# browser_window (COVERAGE-ALERT-1, #1216): the 24h bill prices its browser card targets over the
# last 7 days ("7d"), its HTTP targets over its own 24 hours. The browser queue runs each network
# and target once a UTC day at a shifting hour, so 24 hours hold all of them in only a third of the
# builds. A browser target with no run in the 24 hours is "carried over" (its hours since the last
# run in the 7 days are published, and the component is "stale"); with none in 7 days it is
# missing. Without the key every window prices every target over its own time.
[value]
basis = "rank_all_targets"
price = "first_200gb_plan"
browser_window = "7d"

[peer.diversity]
# Diversity mixes the ratios of the four pool dimensions with these weights (sum to one).
countries = 0.30
regions = 0.20
cities = 0.25
asns = 0.25

[grades]
"A+" = 88
A = 80
"B+" = 72
B = 64
"C+" = 56
C = 48
D = 0

[profiles.balanced]
reliability = 22
speed = 14
uptime = 10
coverage = 12
diversity = 8
dcAsns = 10
authenticity = 10
value = 14
[profiles.latency_first]
reliability = 16
speed = 38
uptime = 8
coverage = 8
diversity = 6
dcAsns = 6
authenticity = 6
value = 12

# Group targets (browser pulse): a group target is measured over the union of its sources'
# requests and is never scheduled itself. Each source keeps its own entry, with the group named.
# social_web, "Social media web app" (the owner, 2026-11-16): Instagram and X profiles as one
# target, so neither counts on its own in an overall and the group reaches browser_min_requests
# over both sources' tries.
# Browser targets are per-target only: their runs never enter a network's window metrics, census
# overlap, series, uptime, coverage, scores, fleet totals or breakdowns (calculated/browser.py),
# so no browser target is a required target. The one exception is value with basis
# "rank_all_targets": its all-targets cost prices every card target, browser ones included.
[target_groups]
social_web = ["instagram_web", "x_web"]
ai_answers = ["ai_overview", "ai_chatgpt", "ai_gemini"]

# Target difficulty, 1 (easy) to 5 (hard): FIXED values the owner set on 2026-11-12. They are
# never derived from results (success rates, ranks or outcomes) and change only on the owner's
# word. tests/test_target_difficulty.py holds them and fails on any drift (this file, the site
# catalog api/scripts/catalog-targets.sql, the served /v1/meta fixture).
# [browser_difficulty]: the weight of a browser target's success score in a network's overall
# browser score (calculated/target_scores.py). Every run target needs one; a group without one
# takes its hardest source's. The overall counts the page targets and each group, never a
# group's sources.
[browser_difficulty]
amazon_pdp = 2
social_web = 3
instagram_web = 3
x_web = 3
google_search = 4
cloudflare_challenge = 4
linkedin_public = 5
ai_answers = 5
ai_overview = 5
ai_chatgpt = 5
ai_gemini = 5

# [http_difficulty]: each HTTP target's weight in the all-targets challenge score
# (target_scores.py challenge_overall). It is not part of the browser overall.
[http_difficulty]
generic_http = 1
generic_https = 1

# [success_score]: the displayed Success x/10 (success_overall, its days and its delta; the owner's
# decision of 2026-11-16, #1229). Display only: the Atlas Score's reliability reads each target's
# time-slot success rate, never this. basis "daily_tests": per window, each network's daily country
# tests alone (runs outside a batch: no pulse, load or browser run) on generic_http, the only target
# they run, in the countries that counted when each test started (country_verdicts), as one pooled
# ratio: successes / completed requests, at least 100 requests (target_scores.MIN_REQUESTS). The
# score is the distance from the best network of the kind in the same window:
# max(floor, 10 - slope x (best - yours) in percentage points), so the best reads 10.
# Caveat: the daily tests run at 2,000 connections a country (500 for Geonode and SOAX, about 30
# for Proxy-Cheap), so the figure compares success under very different loads.
[success_score]
basis = "daily_tests"
slope = 1.0
floor = 1.0

# Optional overrides: [products."provider/product"] and [targets.target_id].
# Override weights, target_weights, peer, required_targets or eligibility settings.
# Product settings are applied first; target settings take precedence for target scores.
# kind sets a product's peer group (residential, datacenter, isp, mobile, ...); without it the
# product name is the kind, so "<provider>/residential" products compare with each other.
[products."shifter/residential"]
kind = "residential"
display_name = "Shifter"
