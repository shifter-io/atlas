# NodeMaven Residential. https://help.nodemaven.com/
# Never put account credentials in this file.
# Credential grammar: src/atlas/providers/grammars/nodemaven.toml
schema_version = 1
provider = "nodemaven"

[credentials]
account_env = "NODEMAVEN_ACCOUNT"
password_env = "NODEMAVEN_PASSWORD"

[settings]
scheme = "http" # http or socks5
# session_policy = "per_request" # rotate, fixed, per_request, per_worker, per_run

[parameters]
# All optional; None omits a value. A session implies fixed sessions.
# country = "us"
# region = "california"
# city = "los_angeles"
# zip = "90001"
# isp = "value"
# type = "mobile"
# ipv4 = true
# session = "example1"
# ttl = 10 # Minutes; requires a session
# filter = "low"
# speed = "fast"
