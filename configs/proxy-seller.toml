# Proxy-Seller Residential. https://docs.proxy-seller.com/
# Never put account credentials in this file.
# Credential grammar: src/proxy_index/providers/grammars/proxy-seller.toml
schema_version = 1
provider = "proxy-seller"

[credentials]
account_env = "PROXY_SELLER_ACCOUNT"
password_env = "PROXY_SELLER_PASSWORD"

[settings]
scheme = "http" # http or socks5
# The dashboard list's country. The login carries no geography, so a run may only ask for this
# country (census rounds and probes pass one); a list per country needs its own login.
presets = { country = "us" }
# port = 10000
# The grammar default is per_request: each request takes the next port (10000-10999) and each
# pass over the range is a new session. Census rounds and probes use it; gateway keeps one port.
# session_policy = "per_request" # gateway, fixed, per_request, per_worker, per_run

[parameters]
# All optional; None omits a value. A session implies fixed sessions.
# session = 0 # Port slot index; port = 10000 + slot
