# Proxy-Seller Residential. https://docs.proxy-seller.com/
# Never put account credentials in this file.
# Credential grammar: src/atlas/providers/grammars/proxy-seller.toml
schema_version = 1
provider = "proxy-seller"

[credentials]
account_env = "PROXY_SELLER_ACCOUNT"
password_env = "PROXY_SELLER_PASSWORD"

[settings]
scheme = "http" # http or socks5
# Credentials: the "API tool" login (one login for every country; a run picks the country
# with --param country=XX). A dashboard list login ignores the country flag.
# port = 10000
# The grammar default is per_request: each request takes the next port (10000-10999) and a new
# exit. Census rounds and probes use it; gateway keeps one port; sticky policies add `_s_<slot>`.
# session_policy = "per_request" # gateway, fixed, per_request, per_worker, per_run

[parameters]
# All optional; None omits a value. A session implies fixed sessions.
# session = 0 # Port slot index; port = 10000 + slot
