# Rayobyte Residential. https://rayobyte.com/community/residential-proxies-documentation/
# Never put account credentials in this file.
# Credential grammar: src/proxy_index/providers/grammars/rayobyte.toml
schema_version = 1
provider = "rayobyte"

[credentials]
account_env = "RAYOBYTE_ACCOUNT"
password_env = "RAYOBYTE_PASSWORD"

[settings]
scheme = "http" # http
# gateway = "us-east" # us-east, la
# session_policy = "per_request" # rotate, fixed, per_request, per_worker, per_run

[parameters]
# All optional; None omits a value. A session implies fixed sessions.
# country = "us"
# region = "california"
# city = "los_angeles"
# zip = "90001"
# asn = 7922
# session = "example1"
# ttl = 10 # Minutes; requires a session
