# Shifter Residential. Never put account credentials in this file.
# Credential grammar: src/proxy_index/providers/grammars/shifter.toml
schema_version = 1
provider = "shifter"

[credentials]
account_env = "SHIFTER_ACCOUNT" # Base account ID, optionally prefixed with customer-
password_env = "SHIFTER_PASSWORD"

[settings]
scheme = "http" # http or socks5; either supports generic_http and generic_https
gateway = "auto" # auto, fra, ams, lon, nyc, tor, sgp, blr, syd; port 443
# session_policy = "per_request" # rotate, fixed, per_request, per_worker, per_run
# pool = "full_geo" # Set only if verified: full_geo, country_geo, non_geo

[parameters]
# All optional. Omit session for rotation; an explicit session implies fixed sessions.
# country = "us"
# region = "california"
# city = "los_angeles"
# asn = 7922
# strict = true
# session = "example-session"
# ttl = 2 # Minutes; requires a supplied or generated session

[extra_flags]
# Explicit escape hatch for future Shifter flags; support is not guaranteed.
