# Staging profile for `milf-framework staging init --config configs/staging.toml [--clean]`.
# Host, port, user and password come from .secrets/database.toml (the app user owns the staging
# database); .secrets/postgres-admin.toml creates it. The name must differ from production.

[database]
name = "proxy_reviews_staging"

[scope]
# Every other country is disabled.
countries = ["RO", "BG"]

[census]
# A census for every country in scope on each aligned 4-minute slot (setting census.every_minutes).
every_minutes = 4
# targets.census_concurrency of the census targets.
concurrency = 100
# Successes before the unique-ratio rule is evaluated (setting census.min_sample).
min_sample = 1000

[pulse]
# Applied to every pulse-enabled target.
interval_minutes = 2
requests = 100

[scheduler]
census = true
pulse = true

[reports]
# HTML batch reports and index.html, written as batches close (relative to the working directory).
dir = "reports/staging"

[[nodes]]
provider = "shifter"
product = "residential"
region = "fra1"
