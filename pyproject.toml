[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "proxy-index"
version = "0.9.5"
description = "Composable proxy targets, bounded asynchronous runs and local IP enrichment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aiohttp>=3.14.4,<4",
  "aiohttp-socks>=0.11,<0.12",
  "maxminddb>=2.8,<4",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
# Browser pulse hosts only: `uv sync --locked --extra browser`. The browser itself is
# fetched by `proxy-index browser fetch` (src/proxy_index/browser/release.py).
browser = ["camoufox==0.5.9", "playwright==1.62.0"]

[project.scripts]
proxy-index = "proxy_index.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6", "pytest-timeout>=2.4", "pytest-xdist>=3.8", "ruff>=0.12", "trustme>=1.2"]

[tool.uv]
# fpgen (camoufox) needs indexed-zstd: 1.7.x has no macOS x86_64 wheel; 1.6.1 has
# self-contained wheels for every browser platform, so the Intel minis need no compiler.
constraint-dependencies = ["indexed-zstd==1.6.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/proxy_index"]

# Nodes and the orchestrator resolve regions and seed targets from these when installed.
[tool.hatch.build.targets.wheel.force-include]
"configs/regions.yaml" = "proxy_index/configs/regions.yaml"
"configs/countries.json" = "proxy_index/configs/countries.json"
"configs/targets.toml" = "proxy_index/configs/targets.toml"
"configs/methodology.toml" = "proxy_index/configs/methodology.toml"
"configs/staging.toml" = "proxy_index/configs/staging.toml"
"configs/staging-methodology.toml" = "proxy_index/configs/staging-methodology.toml"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "configs", "credentials.toml.example", "database.toml.example", "README.md", "LICENSE", "pyproject.toml", "uv.lock", ".gitignore", ".github", "db-ip/README.html"]
exclude = [".secrets/**", ".state/**", "onboarding-networks/**", "**/credentials.toml", "**/database.toml", "**/.env", "**/.env.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "scale: simulated high-volume benchmark",
  "browser_live: the real pinned Camoufox (scripts/ci/browser_live.sh)",
  # CI runs the suite with pytest-xdist, then the serial set alone. Only for a test that
  # measures time or memory and fails under parallel load; never weaken such a test.
  "serial: measures time or memory; CI runs it after the parallel run, without xdist",
  # Over 60 s alone. Pull requests skip these; pushes to main, the nightly run and
  # dispatches run them.
  "slow: over 60 s alone; CI runs it on main, nightly and on dispatch, not on pull requests",
]
# A hung test fails on its own instead of stalling the whole run.
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
