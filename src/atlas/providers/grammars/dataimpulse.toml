# DataImpulse Residential. https://docs.dataimpulse.com/
# Flags follow "__" after the login: key.value pairs separated by ";".
# Unknown keys and out-of-range values are silently accepted by the gateway.
schema_version = 1
id = "dataimpulse"

[credential]
flags_in = "username"
username = "{account}"
first_separator = "__"
separator = ";"

[account]
pattern = "[A-Za-z0-9]+"

[gateway]
host = "gw.dataimpulse.com"
ports = { http = 823, socks5 = 824 } # Rotating; ports 10000-20000 are sticky per port.

[flags.country]
kind = "country"
format = "cr.{}"
case = "lower"

[flags.region]
kind = "name"
format = "state.{}"
case = "lower"
requires = ["country"]

[flags.city]
kind = "name"
format = "city.{}"
case = "lower"
requires = ["country"]

[flags.zip]
kind = "token"
format = "zip.{}"
pattern = "[0-9]{5}"
requires = ["country"]

[flags.asn]
kind = "integer"
format = "asn.{}"
min = 1
max = 4294967295
requires = ["country"]

[flags.session]
kind = "session"
format = "sessid.{}"
pattern = "[A-Za-z0-9]{1,32}"

[flags.ttl]
kind = "integer"
format = "sessttl.{}"
min = 1
max = 120
requires_session = true

[session]
flag = "session"
generate = "alnum"
length = 12
ttl_flag = "ttl"
default_ttl_seconds = 1800

[testing]
max_concurrency = 2000 # CONC-1 probe 2026-10-24: highest step that passed, one c-4 worker, US, 25,000 requests
# 2026-10-25, eight workers at 2,000 on one account: 17-56% refused or dropped gateway
# connections while successes continued (0.7% for one worker alone), so a refusal soon after a
# success is a rate limit (answers.py REFUSALS: errors proxy_connect and connection).
rate_limit_connect = true
