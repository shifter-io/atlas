# Infatica Residential. https://infatica.io/documentation/
# Ports 10000-10999 are independent exit slots sharing the same login. Unknown keys
# return 407; a country without exits returns 503.
# Plain-HTTP targets get a gateway 301 to HTTPS (100% on 2026-10-22), so HTTP echo
# tests run over HTTPS ([testing] protocol https-only).
schema_version = 1
id = "infatica"

[credential]
flags_in = "username"
username = "{account}"
separator = "_"

[account]
pattern = "[A-Za-z0-9]+"

[gateway]
host = "pool.infatica.io"
ports = { http = 10000, socks5 = 10000 }
port_override = true

[flags.country]
kind = "country"
format = "c_{}"
case = "upper"

[flags.city]
kind = "name"
format = "city_{}"
spaces = "-" # e.g. New-York.
pattern = "[A-Za-z][A-Za-z-]*"
requires = ["country"]

[flags.asn]
kind = "integer"
format = "asn_{}"
min = 1
max = 4294967295

[flags.zip]
kind = "token"
format = "zip_{}"
pattern = "[A-Za-z0-9]{2,10}"
requires = ["country"]

[flags.session]
kind = "session"
format = "s_{}"
pattern = "[A-Za-z0-9]{1,32}"

[flags.ttl]
kind = "integer"
format = "ttl_{}m"
min = 1
max = 1440
requires_session = true

[session]
flag = "session"
generate = "alnum"
length = 12
ttl_flag = "ttl"
default_ttl_seconds = 3600

[testing]
max_concurrency = 2000 # CONC-1 probe 2026-10-24: highest step that passed, one c-4 worker, US, 25,000 requests
protocol = "https-only" # Never send plain HTTP; echo tests use HTTPS
# LOWAVAIL-1 (2026-11-15 daily tests, docs/reports/lowavail-answers.md): no exits in the country;
# 16.2% of requests in countries under 10 IPs, 0.04% in big ones (its 407 is a login error, never
# one)
no_inventory_statuses = [503]
