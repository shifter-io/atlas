# Proxy-Seller Residential. https://docs.proxy-seller.com/
# One "API tool" login (PUT resident/list/tools) targets by username suffix: `_c_<CC>` picks the
# country, `_s_<id>` keeps an exit (docs.proxy-seller.com/residential-proxy/api-tool). Dashboard
# list logins ignore `_c_` and refuse `-country-` style flags (407), so use the API-tool login.
# Without a session each request gets a new exit; per request takes the next port (10000-10999)
# for concurrency. A port alone keeps no exit, so sticky sessions also carry `_s_<slot>`.
schema_version = 1
id = "proxy-seller"

[credential]
flags_in = "username"
username = "{account}"
separator = "_"

[account]
pattern = "[A-Za-z0-9]+"

[flags.country]
format = "c_{}"
kind = "country"
case = "upper"
# resident/geo, 2026-10-25: the countries Proxy-Seller serves; others are no_list.
countries = [
  "AD", "AE", "AF", "AG", "AI", "AL", "AM", "AO", "AR", "AS", "AT", "AU", "AW", "AX", "AZ",
  "BA", "BB", "BD", "BE", "BF", "BG", "BH", "BI", "BJ", "BM", "BN", "BO", "BQ", "BR", "BS",
  "BT", "BW", "BY", "BZ", "CA", "CD", "CF", "CG", "CH", "CI", "CK", "CL", "CM", "CN", "CO",
  "CR", "CU", "CV", "CW", "CY", "CZ", "DE", "DJ", "DK", "DM", "DO", "DZ", "EC", "EE", "EG",
  "ES", "ET", "FI", "FJ", "FK", "FM", "FO", "FR", "GA", "GB", "GD", "GE", "GF", "GG", "GH",
  "GI", "GM", "GN", "GP", "GQ", "GR", "GT", "GU", "GW", "GY", "HK", "HN", "HR", "HT", "HU",
  "ID", "IE", "IL", "IM", "IN", "IO", "IQ", "IR", "IS", "IT", "JE", "JM", "JO", "JP", "KE",
  "KG", "KH", "KM", "KN", "KR", "KW", "KY", "KZ", "LA", "LB", "LC", "LI", "LK", "LR", "LS",
  "LT", "LU", "LV", "LY", "MA", "MC", "MD", "ME", "MF", "MG", "MH", "MK", "ML", "MM", "MN",
  "MO", "MP", "MQ", "MR", "MS", "MT", "MU", "MV", "MW", "MX", "MY", "MZ", "NA", "NC", "NE",
  "NG", "NI", "NL", "NO", "NP", "NZ", "OM", "PA", "PE", "PF", "PG", "PH", "PK", "PL", "PM",
  "PR", "PS", "PT", "PW", "PY", "QA", "RE", "RO", "RS", "RU", "RW", "SA", "SB", "SC", "SD",
  "SE", "SG", "SH", "SI", "SK", "SL", "SM", "SN", "SO", "SR", "SS", "ST", "SV", "SX", "SY",
  "SZ", "TC", "TD", "TG", "TH", "TJ", "TL", "TM", "TN", "TO", "TR", "TT", "TW", "TZ", "UA",
  "UG", "US", "UY", "UZ", "VC", "VE", "VG", "VI", "VN", "VU", "WF", "WS", "XK", "YE", "YT",
  "ZA", "ZM", "ZW",
]

[flags.slot]
format = "s_{}"
kind = "session"

[gateway]
host = "res.proxy-seller.com"
ports = { http = 10000, socks5 = 10000 }
port_override = true

[session]
mode = "port"
ports = [10000, 10999]
no_session_policy = "per_request"
slot_flag = "slot"

[testing]
max_concurrency = 2000 # CONC-1 probe 2026-10-25: highest step that passed, one c-4 worker, US, per-request port rotation, 25,000 requests
# LOWAVAIL-1 (2026-11-15 daily tests, docs/reports/lowavail-answers.md): no exits in the country;
# 28.3% of requests in countries under 10 IPs, 2.4% in big ones
no_inventory_statuses = [503]
