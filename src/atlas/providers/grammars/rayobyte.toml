# Rayobyte Residential. https://rayobyte.com/community/residential-proxies-documentation/
# Flags are appended to the PASSWORD. Unknown flags are silently ignored.
schema_version = 1
id = "rayobyte"

[credential]
flags_in = "password"
username = "{account}"
password = "{password}"

[gateway]
default = "us-east"
hosts = { us-east = "us-east.gw.rayobyte.com", la = "la.residential.rayobyte.com" }
ports = { http = 8000 }

[flags.country]
kind = "country"
format = "country-{}"
case = "upper"

[flags.region]
kind = "name"
format = "region-{}"
case = "lower"
requires = ["country"]

[flags.city]
kind = "name"
format = "city-{}"
case = "lower"
requires = ["country"]

[flags.zip]
kind = "token"
format = "zip-{}"
pattern = "[A-Za-z0-9]{2,10}"
requires = ["country"]

[flags.asn]
kind = "integer"
format = "asn-AS{}"
min = 1
max = 4294967295

[flags.session]
kind = "session"
format = "session-{}"
pattern = "[A-Za-z0-9]{1,32}"

[flags.ttl]
kind = "integer"
format = "duration-{}"
min = 1
max = 60
requires_session = true

[session]
flag = "session"
generate = "alnum"
length = 8
ttl_flag = "ttl"

[testing]
max_concurrency = 2000 # CONC-1 probe 2026-10-24: highest step that passed, one c-4 worker, US, 25,000 requests
