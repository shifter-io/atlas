# Massive Residential. https://docs.joinmassive.com/residential/
# Unknown flags are silently ignored by the gateway; this grammar rejects them instead.
schema_version = 1
id = "massive"

[credential]
flags_in = "username"
username = "{account}"

[account]
pattern = "[A-Za-z0-9]+"

[gateway]
host = "network.joinmassive.com"
ports = { http = 65534, socks5 = 65533 }

[flags.country]
kind = "country"
format = "country-{}"
case = "upper"

[flags.region]
kind = "token"
format = "subdivision-{}"
pattern = "[A-Za-z0-9]{1,3}"
case = "upper"
requires = ["country"]

[flags.city]
kind = "name"
format = "city-{}"
spaces = " " # GeoNames English name with normal capitalization, e.g. "New York".
pattern = "[A-Za-z][A-Za-z .']*"
requires = ["country"]

[flags.zip]
kind = "token"
format = "zipcode-{}"
pattern = "[A-Za-z0-9]{2,10}"
requires = ["country"]

[flags.asn]
kind = "integer"
format = "asn-{}"
min = 1
max = 4294967295

[flags.type]
kind = "choice"
format = "type-{}"
choices = ["mobile", "common", "tv"]

[flags.session]
kind = "session"
format = "session-{}"
pattern = "[A-Za-z0-9_]{1,64}"

[flags.ttl]
kind = "integer"
format = "sessionttl-{}"
min = 1
max = 1440
requires_session = true

[session]
flag = "session"
generate = "alnum"
length = 16
ttl_flag = "ttl"
default_ttl_seconds = 900
