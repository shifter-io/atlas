# Proxy-Cheap Residential. No public grammar documentation; verified live 2026-10-22.
# Flags are appended to the PASSWORD. Self-made sessions must be eight digits and
# carry a ttl, otherwise the gateway answers 502/504. Unknown keys return 500.
# About 45% of plain-HTTP requests get a gateway 301 to HTTPS (2026-10-23); HTTP echo
# tests follow that redirect over HTTPS ([testing] protocol mixed).
schema_version = 1
id = "proxy-cheap"

[credential]
flags_in = "password"
username = "{account}"
password = "{password}"
separator = "_"

[gateway]
host = "thehub.proxy-cheap.com"
ports = { http = 8080 }

[flags.country]
kind = "country"
format = "country-{}"
case = "lower"

[flags.session]
kind = "session"
format = "session-{}"
pattern = "[0-9]{8}"
requires = ["ttl"]

[flags.ttl]
kind = "integer"
format = "ttl-{}" # Unit undocumented; treated as minutes.
min = 1
max = 1440
requires_session = true

[session]
flag = "session"
generate = "digits"
length = 8
ttl_flag = "ttl"

[testing]
protocol = "mixed" # HTTP first; follow a gateway redirect to HTTPS
