# Proxy-Seller Residential. https://docs.proxy-seller.com/
# List logins take geo and rotation from the dashboard list; username suffixes are refused
# (407). Each port 10000-10999 is one exit slot, so sessions select ports. The list's country
# is declared in the config (`presets`); a request for another country is refused.
schema_version = 1
id = "proxy-seller"

[credential]
flags_in = "username"
username = "{account}"

[account]
pattern = "[A-Za-z0-9]+"

[flags.country]
kind = "country"
case = "lower"
preset = true

[gateway]
host = "res.proxy-seller.com"
ports = { http = 10000, socks5 = 10000 }
port_override = true

[session]
mode = "port"
ports = [10000, 10999]
no_session_policy = "gateway"

[testing]
max_concurrency = 2000 # CONC-1 probe 2026-10-25: highest step that passed, one c-4 worker, US, per-request port rotation, 25,000 requests
